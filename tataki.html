<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ムシバ たたき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #2b1a12;
        --bg: #ffd43b;
        --red: #ff4d3d;
        --gum: #ff8fa3;
        --paper: #fffaf0;
        --m0: #ff8a3d;
        --m1: #2fa8ff;
        --m2: #a765ff;
        --m3: #22b35e;
        --display: 'Dela Gothic One', 'M PLUS Rounded 1c', sans-serif;
        --gut: clamp(10px, 2vw, 28px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; font-weight: 700; color: var(--ink);
        background: radial-gradient(circle, rgba(255, 255, 255, .35) 2px, transparent 2.5px) 0 0 / 22px 22px, var(--bg);
        overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
        transition: background-color .4s;
    }
    body.fever { animation: feverBg 1.2s linear infinite; }
    @keyframes feverBg { 0% { background-color: #ffd43b; } 25% { background-color: #ff9ad5; } 50% { background-color: #8fe3ff; } 75% { background-color: #b5ff8a; } 100% { background-color: #ffd43b; } }
    button, input { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    #app {
        height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
        gap: clamp(8px, 1.6vh, 16px);
        padding: max(12px, env(safe-area-inset-top)) var(--gut) max(12px, env(safe-area-inset-bottom));
    }

    /* ===== HUD ===== */
    #hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 14px; align-items: center; }
    .logo { font-family: var(--display); font-size: clamp(20px, 2.4vw, 32px); line-height: 1; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
    .box { background: var(--paper); border: 4px solid var(--ink); border-radius: 20px; box-shadow: 5px 5px 0 var(--ink); }
    #timer { padding: 8px 14px; display: flex; align-items: center; gap: 12px; }
    #timer b { font-family: var(--display); font-weight: 400; font-size: 26px; min-width: 2ch; text-align: right; }
    .tbar { flex: 1; height: 18px; border-radius: 9px; background: #ffe6c7; border: 3px solid var(--ink); overflow: hidden; }
    .tbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d3d, #ffb13b); }
    #timer.hurry b { color: var(--red); animation: pulse .5s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.2); } }
    #scorebox { padding: 6px 18px; text-align: right; line-height: 1; }
    #scorebox span { font-size: 11px; display: block; }
    #scorebox #score { font-family: var(--display); font-size: clamp(26px, 3vw, 40px); }
    .icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--ink); background: var(--paper); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }

    /* ===== 歯ならび ===== */
    #board { position: relative; min-height: 0; display: flex; flex-direction: column; }
    #mouth {
        position: relative; flex: 1; min-height: 0; border-radius: 40px 40px 120px 120px;
        background: radial-gradient(ellipse at 50% 120%, #7a1f35, #4a0f22 70%);
        border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
        display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
    }
    #mouth::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 22%; background: var(--gum); border-bottom: 5px solid var(--ink); border-radius: 0 0 50% 50% / 0 0 60% 60%; }
    #combo {
        position: absolute; top: 4%; left: 3%; z-index: 3; text-align: left; line-height: 1;
        font-family: var(--display); color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; opacity: 0; transition: opacity .2s;
    }
    #combo.show { opacity: 1; }
    #combo b { font-size: clamp(34px, 4vw, 56px); color: var(--bg); }
    #combo small { display: block; font-size: 15px; }
    #combo.pop b { display: inline-block; animation: comboPop .3s cubic-bezier(.2, 1.8, .4, 1); }
    @keyframes comboPop { from { transform: scale(1.6); } }
    #fever-tag { position: absolute; top: 3%; right: 3%; transform: rotate(4deg); z-index: 3; padding: 6px 18px; border-radius: 999px; background: #fff; border: 4px solid var(--ink); font-family: var(--display); font-size: clamp(13px, 1.8vw, 24px); white-space: nowrap; animation: wiggle .4s ease-in-out infinite; }
    @keyframes wiggle { 50% { transform: rotate(-4deg) scale(1.06); } }

    #holes { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2vw, 28px); padding: 0 clamp(12px, 3vw, 40px); align-items: end; }
    .hole { position: relative; aspect-ratio: 1 / 1.15; max-height: 52vh; justify-self: center; width: 100%; }
    .hole .tooth { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pit { position: absolute; left: 24%; right: 24%; top: -46%; bottom: 79%; overflow: hidden; z-index: 2; }
    .mole {
        position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
        transform: translateY(105%); transition: transform .16s ease-out;
    }
    .mole svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .mole.up { transform: translateY(0); }
    .mole.hit { transform: translateY(0) scale(1.1, .7); filter: brightness(2); transition: transform .08s; }
    .mole.leave { transform: translateY(105%); transition: transform .25s ease-in; }
    .mole.shake svg { animation: moleShake .12s linear infinite; }
    @keyframes moleShake { 50% { transform: translateX(4%); } }
    #theme {
        position: absolute; top: 3%; left: 0; right: 0; margin: 0 auto; width: max-content; z-index: 4; text-align: center;
        padding: 8px 26px 10px; border-radius: 20px; background: #fff; border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
        max-width: 60%; white-space: nowrap;
    }
    #theme small { display: block; font-size: 12px; }
    #theme b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 2.8vw, 38px); }
    #theme .tb { height: 6px; border-radius: 3px; background: #ffe6c7; margin-top: 4px; overflow: hidden; }
    #theme .tb i { display: block; height: 100%; width: 100%; background: var(--red); }
    #theme.pop { animation: comboPop .4s cubic-bezier(.2, 1.8, .4, 1); }
    .mole .tag {
        position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); z-index: 2;
        padding: 3px 10px; border-radius: 10px; background: #fff; border: 3px solid var(--ink);
        font-size: clamp(11px, 1.35vw, 19px); font-weight: 800; white-space: nowrap;
    }
    #sumup {
        position: fixed; left: 50%; top: 50%; z-index: 35; transform: translate(-50%, -50%); width: min(560px, 92vw);
        padding: 20px 24px; border-radius: 26px; background: var(--paper); border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
        text-align: center; animation: comboPop .4s cubic-bezier(.2, 1.6, .4, 1);
    }
    #sumup .sk { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; }
    #sumup h3 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3vw, 36px); margin: 6px 0; }
    #sumup p { margin: 0; line-height: 1.7; font-size: clamp(14px, 1.6vw, 18px); }
    #sumup .ok { margin-top: 8px; font-size: 13px; }
    .mode-pick { display: grid; grid-template-columns: 1.8fr 1fr; align-items: center; gap: 12px; max-width: 460px; margin: 0 auto 18px; }
    .mode-pick button { display: flex; flex-direction: column; align-items: center; padding: 10px; border-radius: 18px; background: #fff; border: 4px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
    .mode-pick b { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .08em; }
    .mode-pick small { font-size: 12px; }
    .mode-pick button.on { background: var(--red); color: #fff; }
    /* 2分（BASIC）がメイン、1分（FAST）はおまけ */
    .mode-pick button[data-mode="basic"] { padding: 16px 10px; }
    .mode-pick button[data-mode="basic"] b { font-size: 30px; }
    .mode-pick button[data-mode="basic"] small { font-size: 14px; }
    .mode-pick button[data-mode="fast"] { padding: 6px; }
    .mode-pick button[data-mode="fast"] b { font-size: 15px; }
    .mode-pick button[data-mode="fast"] small { font-size: 11px; }
    #learned { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 6px; text-align: left; }
    #learned li { padding: 8px 12px; border-radius: 12px; background: #fff3d6; border: 2px solid var(--ink); font-size: 13px; line-height: 1.5; }
    #learned li b { font-size: 15px; }
    .lip { position: absolute; left: 20%; right: 20%; top: 16.5%; height: 9%; border-radius: 50%; background: #3a0b18; border: 3px solid var(--ink); z-index: 1; }
    .lip-front { position: absolute; left: 20%; right: 20%; top: 21%; height: 4.5%; border-radius: 0 0 50% 50% / 0 0 100% 100%; background: #3a0b18; border: 3px solid var(--ink); border-top: 0; z-index: 3; }
    .hold-ring { position: absolute; left: 50%; top: 52%; width: 34%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: conic-gradient(#fff calc(var(--h, 0) * 360deg), transparent 0); opacity: .9; z-index: 2; pointer-events: none; mask: radial-gradient(circle, transparent 55%, #000 57%); -webkit-mask: radial-gradient(circle, transparent 55%, #000 57%); }

    #labels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2vw, 28px); padding: 0 clamp(12px, 3vw, 40px); }
    .lbl {
        display: flex; align-items: center; justify-content: center; gap: 10px; padding: clamp(10px, 1.6vh, 16px) 8px;
        border-radius: 18px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
        cursor: pointer; touch-action: none; transition: transform .08s, background .08s;
    }
    .lbl i { font-style: normal; width: clamp(38px, 3.6vw, 50px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font-size: clamp(20px, 2.2vw, 28px); border: 3px solid var(--ink); }
    .lbl b { font-size: clamp(14px, 1.5vw, 18px); display: block; }
    .lbl small { font-size: 11px; opacity: .7; }
    .lbl.on { background: color-mix(in srgb, var(--c) 35%, #fff); transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    body:not(.sim) .lbl small { display: none; }

    .pop-txt {
        position: fixed; z-index: 20; pointer-events: none; transform: translate(-50%, -50%);
        font-family: var(--display); font-size: clamp(22px, 2.6vw, 36px); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; white-space: nowrap;
        animation: popUp .9s ease-out forwards;
    }
    .pop-txt.bad { color: var(--red); }
    .pop-txt.gold { color: #ffe14d; font-size: clamp(30px, 3.6vw, 50px); }
    @keyframes popUp { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.5); } 20% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -180%) scale(1); } }

    #big {
        position: fixed; left: 50%; top: 42%; z-index: 30; transform: translate(-50%, -50%); pointer-events: none; text-align: center; white-space: nowrap;
        font-family: var(--display); font-size: clamp(48px, 9vw, 130px); color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; opacity: 0;
    }
    #big.go { animation: big 1s ease-out forwards; }
    @keyframes big { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }

    .overlay { position: fixed; inset: 0; z-index: 40; display: flex; overflow-y: auto; padding: 24px var(--gut); background: rgba(43, 26, 18, .45); }
    .panel { margin: auto; width: min(800px, 100%); padding: clamp(20px, 3vw, 40px); text-align: center; background: var(--paper); border: 5px solid var(--ink); border-radius: 32px; box-shadow: 10px 10px 0 var(--ink); }
    .kicker { display: inline-block; padding: 4px 16px; border-radius: 999px; background: var(--red); color: #fff; border: 3px solid var(--ink); font-size: 13px; }
    .panel h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 7vw, 88px); line-height: 1.05; margin: 14px 0 10px; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--ink); }
    .panel h1 em { font-style: normal; color: var(--bg); }
    .panel h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4.6vw, 54px); margin: 10px 0; }
    .lead { line-height: 1.7; margin: 0 0 22px; font-size: clamp(14px, 1.6vw, 18px); }
    .btn { border: 4px solid var(--ink); border-radius: 999px; padding: 14px 28px; font-size: clamp(16px, 1.7vw, 20px); font-weight: 800; box-shadow: 4px 4px 0 var(--ink); background: #fff; cursor: pointer; }
    .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    .btn.primary { background: var(--red); color: #fff; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
    .legend div { padding: 10px 6px; border-radius: 16px; background: #fff3d6; border: 3px solid var(--ink); font-size: 12px; line-height: 1.4; }
    .legend svg { width: 54px; height: 54px; display: block; margin: 0 auto 4px; }
    .legend b { display: block; font-size: 14px; }
    .res-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
    .res-stats div { padding: 10px; border-radius: 16px; background: #fff3d6; border: 3px solid var(--ink); }
    .res-stats span { display: block; font-size: 12px; }
    .res-stats b { font-family: var(--display); font-weight: 400; font-size: 26px; }
    .entry { display: flex; gap: 8px; justify-content: center; margin: 6px 0 14px; flex-wrap: wrap; }
    .entry input { width: min(240px, 60vw); padding: 12px 16px; border-radius: 999px; border: 4px solid var(--ink); text-align: center; background: #fff; }
    #ranking { list-style: none; padding: 0; margin: 0 auto 18px; max-width: 440px; text-align: left; }
    #ranking li { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; padding: 8px 14px; border-radius: 12px; margin-bottom: 4px; background: #fff3d6; border: 2px solid var(--ink); }
    #ranking li.me { background: var(--bg); }
    #ranking li b { font-family: var(--display); font-weight: 400; }
    #toast { position: fixed; left: 50%; bottom: 20px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; transition: .3s; padding: 10px 20px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; pointer-events: none; max-width: 90vw; text-align: center; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .shake { animation: scr .3s; }
    @keyframes scr { 25% { transform: translate(-8px, 3px); } 50% { transform: translate(7px, -4px); } 75% { transform: translate(-4px, 2px); } }

    @media (max-width: 820px) {
        #theme { max-width: 70%; padding: 6px 14px; }
        #combo b { font-size: 26px; }
        #hud { grid-template-columns: minmax(0, 1fr) auto auto; }
        .logo { display: none; }
        #holes, #labels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #holes { row-gap: 4px; }
        .hole { max-height: 26vh; }
        #mouth { border-radius: 30px; }
        .legend { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .res-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    /* よこ もちの スマホ（せが ひくい）：歯は 4本 1れつ、パッドも 1行で ちいさく */
    @media (max-height: 520px) and (orientation: landscape) {
        #app { gap: 6px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
        #hud { gap: 8px; grid-template-columns: minmax(0, 1fr) auto auto; }
        .logo { display: none; }
        #timer { padding: 3px 10px; }
        #timer b { font-size: 18px; }
        .tbar { height: 12px; }
        #scorebox { padding: 2px 12px; }
        #scorebox #score { font-size: 20px; }
        .icon-btn { width: 36px; height: 36px; border-width: 3px; }
        #mouth { border-radius: 24px 24px 60px 60px; border-width: 4px; }
        #holes, #labels { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 0 20px; }
        .hole { max-height: 44vh; }
        #theme { padding: 3px 14px 5px; border-width: 3px; }
        #theme small { font-size: 10px; }
        #theme b { font-size: 16px; }
        #combo b { font-size: 26px; }
        .lbl { padding: 5px 6px; gap: 6px; border-width: 3px; border-radius: 14px; }
        .lbl i { width: 28px; font-size: 15px; border-width: 2px; }
        .lbl b { font-size: 12px; }
        .lbl small { display: none; }
    }
</style>
</head>
<body>
<div id="app">
    <header id="hud">
        <div class="logo">ムシバ たたき</div>
        <div id="timer" class="box"><b id="time">60</b><div class="tbar"><i id="tbar"></i></div></div>
        <div id="scorebox" class="box"><span>スコア</span><span id="score">0</span></div>
        <button class="icon-btn" id="btn-sound" title="おと（M）">🔊</button>
    </header>

    <section id="board">
        <div id="mouth">
            <div id="combo"><b id="combo-n">0</b><small id="combo-x">COMBO ×1</small></div>
            <div id="theme"><small>この なかまを たたけ！</small><b id="theme-name">-</b><div class="tb"><i id="theme-bar"></i></div></div>
            <div id="fever-tag" class="hidden">🌈 フィーバー ×2 🌈</div>
            <div id="holes"></div>
        </div>
    </section>

    <section id="labels">
        <button class="lbl" data-m="0" style="--c: var(--m0)"><i>↕</i><span><b>たてみがき</b><small>キー ↑↓</small></span></button>
        <button class="lbl" data-m="1" style="--c: var(--m1)"><i>↔</i><span><b>よこみがき</b><small>キー ←→</small></span></button>
        <button class="lbl" data-m="2" style="--c: var(--m2)"><i>↻</i><span><b>ぐるぐる</b><small>キー C</small></span></button>
        <button class="lbl" data-m="3" style="--c: var(--m3)"><i>⤵</i><span><b>うちがわ</b><small>キー G</small></span></button>
    </section>
</div>

<div id="big"></div>
<div id="sumup" class="hidden"></div>
<div id="toast"></div>

<div id="title" class="overlay">
    <div class="panel">
        <span class="kicker">なかま わけ スコアアタック</span>
        <h1>ムシバ<br><em>たたき</em></h1>
        <p class="lead">バイキンが ことばの ふだを もって とびだすよ！<br>お題の「なかま」だけを、その あなの みがきかたで たたこう。<br><b>なかまじゃない ものを たたくと マイナス！</b>（理科・社会）</p>
        <div class="mode-pick" id="mode-pick">
            <button data-mode="basic"><b>BASIC</b><small>2ふん</small></button>
            <button data-mode="fast"><b>FAST</b><small>1ぷん</small></button>
        </div>
        <div class="btn-row">
            <button class="btn primary" id="btn-bt">micro:bit で はじめる</button>
            <button class="btn" id="btn-sim">テストモード</button>
        </div>
    </div>
</div>

<div id="result" class="overlay hidden">
    <div class="panel">
        <span class="kicker">TIME UP</span>
        <h2 id="res-title">やったね！</h2>
        <div class="res-stats">
            <div><span>スコア</span><b id="res-score">0</b></div>
            <div><span>やっつけた</span><b id="res-hit">0</b></div>
            <div><span>さいだい コンボ</span><b id="res-combo">0</b></div>
            <div><span>まちがえて たたいた</span><b id="res-miss">0</b></div>
        </div>
        <h3 style="margin:4px 0 8px;font-size:15px">きょう まなんだ なかま</h3>
        <ul id="learned"></ul>
        <div class="entry" id="entry"><input id="name" maxlength="8" placeholder="なまえ"><button class="btn primary" id="btn-save">ランキングに のせる</button></div>
        <ol id="ranking"></ol>
        <div class="btn-row">
            <button class="btn primary" id="btn-again">つぎの ひと / もういちど</button>
            <button class="btn" id="btn-home">タイトルへ</button>
        </div>
    </div>
</div>

<script>
    const $ = id => document.getElementById(id);

    // micro:bit から届く値: "0"=たて "1"=よこ "2"=ぐるぐる "3"=うちがわ
    const MOTIONS = [
        { name: 'たてみがき', short: 'たて', icon: '↕', color: 'var(--m0)' },
        { name: 'よこみがき', short: 'よこ', icon: '↔', color: 'var(--m1)' },
        { name: 'ぐるぐる',   short: 'ぐるぐる', icon: '↻', color: 'var(--m2)' },
        { name: 'うちがわ',   short: 'うちがわ', icon: '⤵', color: 'var(--m3)' }
    ];
    const HOLD_SEC = 0.6;      // 信号がとぎれても、この秒数は「みがいている」とみなす
    const HIT_SEC = 0.2;       // この秒数 みがくと たたける
    const FEVER_SEC = 6;
    // FAST（1分）／BASIC（2分）
    const COURSES = { fast: { sec: 60, theme: 12, label: 'FAST' }, basic: { sec: 120, theme: 14, label: 'BASIC' } };
    let course = (() => { try { return localStorage.getItem('hamigaki-mode') === 'fast' ? 'fast' : 'basic'; } catch (e) { return 'basic'; } })();
    let GAME_SEC = COURSES[course].sec;
    const rankKey = () => `hamigaki-rank-tataki-${course}`;

    // なかま わけ（理科・社会）
    const THEMES = [
        { name: 'ほにゅうるい', good: ['クジラ', 'コウモリ', 'イルカ', 'ウマ', 'カモノハシ', 'ゾウ', 'パンダ', 'ラッコ'], bad: ['ペンギン', 'サメ', 'カエル', 'トカゲ', 'ニワトリ', 'マグロ', 'ヘビ', 'カメ'],
          note: 'クジラ・イルカ・コウモリも ほにゅうるい（子どもを おちちで そだてる）。ペンギンは 鳥、サメは 魚だよ。' },
        { name: 'こんちゅう', good: ['カブトムシ', 'アリ', 'チョウ', 'トンボ', 'セミ', 'バッタ', 'ハチ', 'テントウムシ'], bad: ['クモ', 'ダンゴムシ', 'ムカデ', 'サソリ', 'カタツムリ', 'ミミズ', 'エビ', 'カニ'],
          note: 'こんちゅうは「あしが 6本」「体が 頭・むね・はら の 3つ」。クモは あしが 8本なので ちがうよ。' },
        { name: 'たいようけいの わくせい', good: ['水星', '金星', '火星', '木星', '土星', '天王星', '海王星', '地球'], bad: ['月', '太陽', '冥王星', '北極星', 'ハレーすい星', 'ベガ', 'イオ', 'オリオン座'],
          note: 'わくせいは 8つ。冥王星は 2006年に「じゅん わくせい」に なった。月は 地球の えいせい。' },
        { name: '金属', good: ['鉄', '銅', 'アルミニウム', '金', '銀', 'あえん', 'なまり', 'すず'], bad: ['ガラス', 'プラスチック', '木', '紙', 'ゴム', '石', '水', 'すみ'],
          note: '金属は「電気を とおす」「みがくと ひかる」「たたくと のびる」。' },
        { name: '気体', good: ['酸素', 'ちっ素', '二酸化炭素', '水素', 'ヘリウム', 'アルゴン'], bad: ['水', '鉄', '食塩', 'さとう', '氷', '銅', '砂', '油'],
          note: '空気は ちっ素が 約78%、酸素が 約21%。ヘリウムは 空気より かるい 気体。' },
        { name: '根を たべる やさい', good: ['ニンジン', 'ダイコン', 'ゴボウ', 'サツマイモ', 'カブ', 'ビーツ'], bad: ['ジャガイモ', 'レンコン', 'キャベツ', 'トマト', 'キュウリ', 'ナス', 'タマネギ', 'レタス'],
          note: 'サツマイモは 根。でも ジャガイモと レンコンは「くき」、タマネギは「葉」が かさなった ものだよ。' },
        { name: '県庁所在地', good: ['仙台', '金沢', '松山', '那覇', '盛岡', '札幌', '神戸', '横浜'], bad: ['川崎', '浜松', '北九州', '函館', '倉敷', '姫路', '郡山', '旭川'],
          note: '仙台（宮城県）、金沢（石川県）、松山（愛媛県）など、県の名前と ちがう 県庁所在地も 多いよ。' },
        { name: '海に めんしていない県', good: ['長野県', '群馬県', '栃木県', '埼玉県', '山梨県', '岐阜県', '滋賀県', '奈良県'], bad: ['静岡県', '千葉県', '愛知県', '三重県', '京都府', '兵庫県', '福岡県', '宮城県'],
          note: '海の ない「内陸県」は この 8県。京都府は 日本海に めんしているよ。' },
        { name: '国の首都', good: ['パリ', 'ロンドン', 'ペキン', 'ソウル', 'カイロ', 'キャンベラ', 'オタワ', 'ブラジリア'], bad: ['シドニー', 'ニューヨーク', 'シャンハイ', 'トロント', 'リオデジャネイロ', 'イスタンブール', 'ムンバイ', 'ロサンゼルス'],
          note: 'オーストラリアの 首都は シドニーではなく キャンベラ。カナダは オタワ、ブラジルは ブラジリア。' },
        { name: '江戸時代の できごと', good: ['参勤交代', '鎖国', '寺子屋', '浮世絵', '黒船来航', '大政奉還'], bad: ['大化の改新', '鎌倉幕府', '遣唐使', '元寇', '応仁の乱', '平安京'],
          note: '江戸時代は 1603〜1867年。大政奉還で 政権が 朝廷に かえされ、江戸時代が おわった。' },
        { name: 'さいせい かのう エネルギー', good: ['太陽光', '風力', '地熱', '水力', 'バイオマス'], bad: ['石油', '石炭', '天然ガス', 'ウラン'],
          note: 'なくならず、CO₂を あまり ださない エネルギー。石油・石炭・天然ガスは「化石燃料」。' }
    ];

    const TYPES = {
        normal: { name: 'バイキン',     pts: 10, hp: 1, life: 1,   body: '#7ccf3a' },
        speedy: { name: 'はやいバイキン', pts: 20, hp: 1, life: 0.6, body: '#3fb4ff' },
        armor:  { name: 'かたいバイキン', pts: 30, hp: 2, life: 1.3, body: '#9b5cff' },
        gold:   { name: 'きんの バイキン', pts: 50, hp: 1, life: 0.6, body: '#ffd21f' }
    };

    function moleSvg(type) {
        if (type === 'candy') {
            return `<svg viewBox="0 0 100 100">
                <rect x="45" y="50" width="10" height="56" rx="5" fill="#fff" stroke="#2b1a12" stroke-width="4"/>
                <circle cx="50" cy="38" r="32" fill="#ff6fb1" stroke="#2b1a12" stroke-width="5"/>
                <path d="M50 38 m0 -22 a22 22 0 1 1 -20 13 a14 14 0 1 1 13 -7 a7 7 0 1 1 5 7" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
                <text x="50" y="98" font-size="14" text-anchor="middle" font-weight="900" fill="#2b1a12">さわるな</text>
            </svg>`;
        }
        const c = TYPES[type].body;
        const helmet = type === 'armor' ? `<path d="M16 40 Q16 6 50 6 Q84 6 84 40Z" fill="#c9d3dd" stroke="#2b1a12" stroke-width="4"/><path d="M50 6 V40" stroke="#2b1a12" stroke-width="3"/>` : '';
        const crown = type === 'gold' ? `<path d="M30 18 L34 0 L42 12 L50 -4 L58 12 L66 0 L70 18Z" fill="#fff4b0" stroke="#2b1a12" stroke-width="3" stroke-linejoin="round"/>` : '';
        const speed = type === 'speedy' ? `<path d="M2 50 H14 M0 62 H12 M86 50 H98 M88 62 H100" stroke="#2b1a12" stroke-width="4" stroke-linecap="round"/>` : '';
        const sparkle = type === 'gold' ? `<path d="M88 22 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff"/>` : '';
        return `<svg viewBox="0 0 100 100">
            ${speed}
            <path d="M14 100 Q10 30 50 22 Q90 30 86 100Z" fill="${c}" stroke="#2b1a12" stroke-width="5" stroke-linejoin="round"/>
            <path d="M24 30 L18 16 M50 22 V6 M76 30 L82 16" stroke="#2b1a12" stroke-width="5" stroke-linecap="round"/>
            <circle cx="18" cy="14" r="6" fill="${c}" stroke="#2b1a12" stroke-width="4"/><circle cx="50" cy="5" r="6" fill="${c}" stroke="#2b1a12" stroke-width="4"/><circle cx="82" cy="14" r="6" fill="${c}" stroke="#2b1a12" stroke-width="4"/>
            ${helmet}${crown}
            <circle cx="36" cy="56" r="11" fill="#fff" stroke="#2b1a12" stroke-width="4"/><circle cx="64" cy="56" r="11" fill="#fff" stroke="#2b1a12" stroke-width="4"/>
            <circle cx="38" cy="58" r="5" fill="#2b1a12"/><circle cx="62" cy="58" r="5" fill="#2b1a12"/>
            <path d="M24 42 L44 48 M76 42 L56 48" stroke="#2b1a12" stroke-width="5" stroke-linecap="round"/>
            <path d="M36 78 Q50 88 64 78" stroke="#2b1a12" stroke-width="5" fill="#fff" stroke-linejoin="round"/>
            ${sparkle}
        </svg>`;
    }

    const toothSvg = `<svg class="tooth" viewBox="0 0 100 115" preserveAspectRatio="none">
        <path d="M8 34 Q6 4 30 6 Q40 12 50 8 Q60 12 70 6 Q94 4 92 34 Q92 66 84 88 Q80 112 70 112 Q62 112 60 96 Q50 84 40 96 Q38 112 30 112 Q20 112 16 88 Q8 66 8 34Z" fill="#fffdf6" stroke="#2b1a12" stroke-width="4"/>
        <path d="M18 30 Q22 18 32 16" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
        <ellipse cx="50" cy="26" rx="34" ry="10" fill="#5a3a1a" opacity=".22"/>
    </svg>`;

    /* ---------- 状態 ---------- */
    const S = {
        mode: 'title',   // title | count | play | over
        sim: true, sound: true,
        left: GAME_SEC, elapsed: 0,
        score: 0, combo: 0, maxCombo: 0, hits: 0, miss: 0, candy: 0,
        spawnIn: 1, fever: 0, nextFever: 10
    };
    const holes = [0, 1, 2, 3].map(() => ({ type: null, age: 0, life: 0, hp: 0, hold: 0, busy: false }));
    let time = 0;
    const motionUntil = [0, 0, 0, 0];
    const keyHeld = new Set();
    const pointerHeld = [false, false, false, false];
    let timers = [];
    function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
    function clearTimers() { timers.forEach(clearTimeout); timers = []; }
    const isBrushing = m => motionUntil[m] > time;
    const lerp = (a, b, t) => a + (b - a) * Math.max(0, Math.min(1, t));

    /* ---------- 入力 ---------- */
    const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_RX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    let rxCharacteristic = null, feedbackBusy = false;

    async function connectBluetooth() {
        initAudio();
        if (!navigator.bluetooth) { toast('この ブラウザは Bluetooth に たいおう していません。テストモードで あそんでね'); return; }
        try {
            const device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "BBC micro:bit" }], optionalServices: [UART_SERVICE_UUID] });
            device.addEventListener('gattserverdisconnected', () => { rxCharacteristic = null; setSim(true); toast('micro:bit との せつぞくが きれました'); });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);
            const txChar = await service.getCharacteristic(UART_TX_CHAR_UUID);
            await txChar.startNotifications();
            txChar.addEventListener('characteristicvaluechanged', (e) => {
                new TextDecoder().decode(e.target.value).split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(onSignal);
            });
            start(false);
        } catch (error) {
            console.error(error);
            toast('せつぞく できませんでした。もういちど ためしてね');
        }
    }
    function onSignal(code) { if (/^[0-3]$/.test(code)) motionUntil[Number(code)] = time + HOLD_SEC; }
    async function sendFeedback(msg) {
        if (!rxCharacteristic || S.sim || feedbackBusy) return;
        feedbackBusy = true;
        try { await rxCharacteristic.writeValue(new TextEncoder().encode(msg + "\n")); } catch (e) { console.error("送信エラー:", e); }
        feedbackBusy = false;
    }

    const KEY_MOTION = { ArrowUp: 0, ArrowDown: 0, ArrowLeft: 1, ArrowRight: 1, c: 2, C: 2, g: 3, G: 3 };
    window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key in KEY_MOTION) { keyHeld.add(e.key); e.preventDefault(); return; }
        if (e.key === 'm' || e.key === 'M') toggleSound();
    });
    window.addEventListener('keyup', (e) => { if (e.key in KEY_MOTION) { keyHeld.delete(e.key); motionUntil[KEY_MOTION[e.key]] = 0; } });
    window.addEventListener('blur', () => { keyHeld.clear(); pointerHeld.fill(false); });
    function bindHold(el, m) {
        const release = () => { pointerHeld[m] = false; motionUntil[m] = 0; };
        el.addEventListener('pointerdown', (e) => { initAudio(); pointerHeld[m] = true; el.setPointerCapture(e.pointerId); });
        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
        el.addEventListener('lostpointercapture', release);
    }
    document.querySelectorAll('.lbl').forEach(el => bindHold(el, Number(el.dataset.m)));
    function pollHeld() {
        keyHeld.forEach(k => { motionUntil[KEY_MOTION[k]] = time + HOLD_SEC; });
        pointerHeld.forEach((h, m) => { if (h) motionUntil[m] = time + HOLD_SEC; });
    }

    /* ---------- すすめかた ---------- */
    function buildHoles() {
        $('holes').innerHTML = [0, 1, 2, 3].map(m => `
            <div class="hole" data-m="${m}">
                ${toothSvg}
                <div class="lip"></div>
                <div class="lip-front"></div>
                <div class="pit"><div class="mole" id="mole-${m}"></div></div>
                <div class="hold-ring" id="ring-${m}"></div>
            </div>`).join('');
        document.querySelectorAll('.hole').forEach(el => bindHold(el, Number(el.dataset.m)));
    }

    function start(sim) {
        initAudio();
        setSim(sim);
        clearTimers();
        GAME_SEC = COURSES[course].sec;
        Object.assign(S, { left: GAME_SEC, elapsed: 0, score: 0, combo: 0, maxCombo: 0, hits: 0, miss: 0, candy: 0, spawnIn: 0.8, fever: 0, nextFever: 10,
            themes: shuffleArr(THEMES), themeIdx: -1, themeLeft: 0, played: [] });
        $('sumup').classList.add('hidden');
        holes.forEach((h, m) => { Object.assign(h, { type: null, busy: false, hold: 0 }); $('mole-' + m).className = 'mole'; });
        document.body.classList.remove('fever');
        $('fever-tag').classList.add('hidden');
        $('title').classList.add('hidden');
        $('result').classList.add('hidden');
        updateHud();
        S.mode = 'count';
        ['3', '2', '1', 'スタート！'].forEach((t, i) => later(400 + i * 800, () => {
            bigText(t);
            tone(i === 3 ? 1320 : 880, i === 3 ? 0.35 : 0.15, 'square', 0.06);
            if (i === 3) say('スタート！', true);
        }));
        later(400 + 3 * 800 + 200, () => { nextTheme(); S.mode = 'play'; });
    }

    // micro:bit は 判定に すこし じかんが かかるので、バイキンが でている じかんを ながめにする
    const lag = () => (S.sim ? 1 : 1.35);

    function update(dt) {
        if (S.mode === 'sum') { S.left -= dt; if (S.left <= 0) gameOver(); return; }
        if (S.mode !== 'play') return;
        S.left -= dt;
        S.elapsed += dt;
        const p = S.elapsed / GAME_SEC;

        S.themeLeft -= dt;
        if (S.themeLeft <= 0 && S.left > 8) { endTheme(); return; }   // のこり わずかなら 今の お題の まま

        if (S.fever > 0) {
            S.fever -= dt;
            if (S.fever <= 0) { document.body.classList.remove('fever'); $('fever-tag').classList.add('hidden'); }
        }

        // バイキンを だす
        S.spawnIn -= dt;
        const upNow = holes.filter(h => h.type).length;
        const maxUp = S.fever > 0 ? 3 : p < 0.3 ? 1 : 2;
        if (S.spawnIn <= 0 && upNow < maxUp) {
            spawn(p);
            S.spawnIn = lerp(1.5, 0.7, p) * (S.fever > 0 ? 0.55 : 1) * (0.8 + Math.random() * 0.4);
        }

        holes.forEach((h, m) => {
            if (!h.type || h.busy) { h.hold = 0; return; }
            h.age += dt;
            if (isBrushing(m) && h.age > 0.12) {
                h.hold += dt;
                if (h.hold >= HIT_SEC) whack(m);
            } else {
                h.hold = 0;
            }
            if (h.type && !h.busy && h.age >= h.life) escape(m);
        });

        if (S.left <= 0) gameOver();
    }

    function spawn(p) {
        const free = holes.map((h, m) => (h.type ? -1 : m)).filter(m => m >= 0);
        if (!free.length) return;
        const m = free[Math.floor(Math.random() * free.length)];
        const th = S.themes[S.themeIdx];
        const good = Math.random() < 0.6;
        const onBoard = holes.map(h => h.word);
        const pool = (good ? th.good : th.bad).filter(w => !onBoard.includes(w));
        const word = pool[Math.floor(Math.random() * pool.length)] || (good ? th.good[0] : th.bad[0]);
        const r = Math.random();
        let type = 'normal';
        if (good && r < 0.12) type = 'gold';
        else if (S.elapsed > 15 && r < 0.25) type = 'armor';
        else if (r < 0.42) type = 'speedy';
        const T = TYPES[type];
        Object.assign(holes[m], { type, word, good, age: 0, hold: 0, hp: T.hp, busy: false, life: lerp(3.6, 2.4, p) * Math.max(0.75, T.life) * lag() });
        const el = $('mole-' + m);
        el.innerHTML = moleSvg(type) + `<div class="tag">${word}</div>`;
        el.className = 'mole';
        void el.offsetWidth;
        el.classList.add('up');
        tone(500 + m * 80, 0.08, 'sine', 0.05);
    }

    function shuffleArr(a) {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
    }

    function nextTheme() {
        S.themeIdx = (S.themeIdx + 1) % S.themes.length;
        S.themeLeft = COURSES[course].theme;
        const th = S.themes[S.themeIdx];
        S.played.push({ theme: th, wrong: [] });
        $('theme-name').textContent = th.name;
        const el = $('theme');
        el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
        S.spawnIn = 0.6;
        say(`${th.name}を たたけ！`, true);
    }

    // お題の おわりに まとめを みせる
    function endTheme() {
        S.mode = 'sum';
        holes.forEach((h, m) => { if (h.type && !h.busy) leave(m, 'leave'); });
        const cur = S.played[S.played.length - 1];
        const th = cur.theme;
        $('sumup').innerHTML = `<span class="sk">まとめ</span><h3>${th.name}</h3><p>💡 ${th.note}</p>
            <div class="ok">なかま：${th.good.slice(0, 5).join('・')} …</div>`;
        $('sumup').classList.remove('hidden');
        say(th.note, true);
        const ms = course === 'fast' ? 2800 : 3600;
        later(ms, () => {
            $('sumup').classList.add('hidden');
            if (S.mode !== 'sum') return;
            nextTheme();
            S.mode = 'play';
        });
    }

    function whack(m) {
        const h = holes[m];
        const el = $('mole-' + m);
        const pos = holeCenter(m);
        if (!h.good) {
            S.score = Math.max(0, S.score - 20);
            S.combo = 0;
            S.candy++;
            S.played[S.played.length - 1].wrong.push(h.word);
            popText(`✕ ${h.word}は ちがう！ -20`, pos, 'bad');
            tone(180, 0.3, 'sawtooth', 0.08);
            $('board').classList.remove('shake'); void $('board').offsetWidth; $('board').classList.add('shake');
            sendFeedback("X");
            leave(m, 'hit');
            return;
        }
        h.hp--;
        if (h.hp > 0) {   // かたい バイキンは もう いっかい
            h.hold = -0.25;
            el.classList.add('shake');
            popText('カン！ もういっかい！', pos, '');
            tone(1500, 0.06, 'square', 0.05);
            return;
        }
        S.combo++;
        S.maxCombo = Math.max(S.maxCombo, S.combo);
        S.hits++;
        const mult = Math.min(3, 1 + Math.floor(S.combo / 5) * 0.5) * (S.fever > 0 ? 2 : 1);
        const pts = Math.round(TYPES[h.type].pts * mult);
        S.score += pts;
        popText(`+${pts}`, pos, h.type === 'gold' ? 'gold' : '');
        tone(h.type === 'gold' ? 1568 : 880 + Math.min(S.combo, 20) * 30, 0.1, 'square', 0.06);
        tone(h.type === 'gold' ? 2093 : 1320 + Math.min(S.combo, 20) * 30, 0.12, 'triangle', 0.05, 0.05);
        const c = $('combo');
        c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
        sendFeedback("O");
        if (S.combo >= S.nextFever) {
            S.nextFever += 10;
            S.fever = FEVER_SEC;
            document.body.classList.add('fever');
            $('fever-tag').classList.remove('hidden');
            bigText('フィーバー！');
            say('フィーバー！ てんすう 2ばい！', true);
            [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.15, 'square', 0.05, i * 0.06));
        }
        leave(m, 'hit');
    }

    function escape(m) {
        const h = holes[m];
        if (h.good) {
            S.combo = 0;
            S.miss++;
            popText('にげられた…', holeCenter(m), 'bad');
            tone(260, 0.15, 'triangle', 0.05);
        }
        leave(m, 'leave');
    }

    function leave(m, how) {
        const h = holes[m];
        h.busy = true;
        const el = $('mole-' + m);
        el.classList.remove('shake');
        if (how === 'hit') {
            el.classList.add('hit');
            setTimeout(() => { el.classList.remove('hit', 'up'); el.classList.add('leave'); }, 120);
        } else {
            el.classList.remove('up');
            el.classList.add('leave');
        }
        setTimeout(() => { h.type = null; h.word = null; h.busy = false; el.className = 'mole'; }, 380);
    }

    function gameOver() {
        if (S.mode === 'over') return;
        clearTimers();
        $('sumup').classList.add('hidden');
        S.mode = 'over';
        S.left = 0;
        holes.forEach((h, m) => { if (h.type && !h.busy) leave(m, 'leave'); });
        document.body.classList.remove('fever');
        $('fever-tag').classList.add('hidden');
        bigText('タイムアップ！');
        say(`タイムアップ！ スコアは ${S.score}てん！`, true);
        [784, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'square', 0.05, i * 0.15));
        later(1400, () => {
            $('res-title').textContent = S.score >= 1500 ? 'ムシバハンター！' : S.score >= 700 ? 'やったね！' : 'よく がんばった！';
            $('res-score').textContent = S.score;
            $('res-hit').textContent = S.hits;
            $('res-combo').textContent = S.maxCombo;
            $('res-miss').textContent = S.candy;
            $('learned').innerHTML = S.played.map(p => `<li><b>${p.theme.name}</b>　${p.theme.note}${p.wrong.length ? `<br><small>まちがえた：${[...new Set(p.wrong)].join('・')}</small>` : ''}</li>`).join('');
            $('entry').classList.remove('hidden');
            $('name').value = '';
            renderRanking();
            $('result').classList.remove('hidden');
        });
    }

    function backToTitle() {
        clearTimers();
        S.mode = 'title';
        $('result').classList.add('hidden');
        $('title').classList.remove('hidden');
    }

    /* ---------- ランキング ---------- */
    function loadRank() { try { return JSON.parse(localStorage.getItem(rankKey())) || []; } catch (e) { return []; } }
    let lastSavedAt = null;
    function saveRank() {
        const name = $('name').value.trim() || 'プレイヤー';
        const list = loadRank();
        lastSavedAt = Date.now();
        list.push({ name, score: S.score, combo: S.maxCombo, at: lastSavedAt });
        list.sort((a, b) => b.score - a.score);
        try { localStorage.setItem(rankKey(), JSON.stringify(list.slice(0, 10))); } catch (e) { console.error(e); }
        $('entry').classList.add('hidden');
        renderRanking();
    }
    function renderRanking() {
        const list = loadRank();
        $('ranking').innerHTML = `<li><span></span><span><small>${COURSES[course].label} ランキング</small></span><span></span></li>` + (list.length
            ? list.map((r, i) => `<li class="${r.at === lastSavedAt ? 'me' : ''}"><b>${i + 1}</b><span>${escapeHtml(r.name)}　<small>コンボ${r.combo}</small></span><b>${r.score}</b></li>`).join('')
            : '<li><span></span><span>まだ きろくが ないよ</span><span></span></li>');
    }
    function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    /* ---------- 表示 ---------- */
    function updateHud() {
        $('score').textContent = S.score;
        $('time').textContent = Math.max(0, Math.ceil(S.left));
        $('tbar').style.width = Math.max(0, S.left / GAME_SEC * 100) + '%';
        $('theme-bar').style.width = S.mode === 'play' ? Math.max(0, S.themeLeft / COURSES[course].theme * 100) + '%' : '0%';
        $('timer').classList.toggle('hurry', S.mode === 'play' && S.left <= 10);
        const c = $('combo');
        c.classList.toggle('show', S.combo >= 2);
        $('combo-n').textContent = S.combo;
        const mult = Math.min(3, 1 + Math.floor(S.combo / 5) * 0.5) * (S.fever > 0 ? 2 : 1);
        $('combo-x').textContent = `COMBO ×${mult}`;
    }

    function render() {
        updateHud();
        document.querySelectorAll('.lbl').forEach((el, m) => el.classList.toggle('on', isBrushing(m)));
        holes.forEach((h, m) => {
            const v = h.type && !h.busy ? Math.max(0, h.hold) / HIT_SEC : 0;
            $('ring-' + m).style.setProperty('--h', Math.min(1, v));
        });
    }

    function holeCenter(m) {
        const r = document.querySelector(`.hole[data-m="${m}"] .pit`).getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height * 0.6 };
    }

    function popText(text, pos, cls) {
        const el = document.createElement('div');
        el.className = 'pop-txt ' + cls;
        el.textContent = text;
        el.style.left = pos.x + 'px';
        el.style.top = pos.y + 'px';
        el.addEventListener('animationend', () => el.remove());
        document.body.appendChild(el);
    }

    function bigText(t) {
        const el = $('big');
        el.textContent = t;
        el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
    }

    let toastTimer = null;
    function toast(text) {
        const t = $('toast');
        t.textContent = text; t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }
    function setSim(sim) { S.sim = sim; document.body.classList.toggle('sim', sim); }

    /* ---------- おと ---------- */
    let ac = null;
    function initAudio() {
        if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ac = new AC(); }
        if (ac.state === 'suspended') ac.resume();
    }
    function tone(freq, dur, type = 'triangle', vol = 0.08, delay = 0) {
        if (!ac || !S.sound) return;
        const t0 = ac.currentTime + delay;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t0);
        g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function say(text, important = false) {
        if (!('speechSynthesis' in window) || !S.sound) return;
        if (!important && speechSynthesis.speaking) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP'; u.rate = 1.2; u.pitch = 1.2;
        speechSynthesis.speak(u);
    }
    function toggleSound() {
        S.sound = !S.sound;
        $('btn-sound').textContent = S.sound ? '🔊' : '🔇';
        if (!S.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
    }

    /* ---------- はじめる ---------- */
    $('btn-bt').addEventListener('click', connectBluetooth);
    $('btn-sim').addEventListener('click', () => start(true));
    $('btn-again').addEventListener('click', () => start(S.sim));
    $('btn-home').addEventListener('click', backToTitle);
    $('btn-save').addEventListener('click', saveRank);
    $('btn-sound').addEventListener('click', toggleSound);
    function setCourse(c) {
        course = c;
        try { localStorage.setItem('hamigaki-mode', c); } catch (e) {}
        document.querySelectorAll('#mode-pick button').forEach(b => b.classList.toggle('on', b.dataset.mode === c));
        GAME_SEC = COURSES[c].sec;
        S.left = GAME_SEC;
    }
    document.querySelectorAll('#mode-pick button').forEach(b => b.addEventListener('click', () => setCourse(b.dataset.mode)));
    setCourse(course);
    buildHoles();
    setSim(true);
    updateHud();

    let lastT = performance.now();
    function loop(now) {
        const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000));
        lastT = now;
        time += dt;
        pollHeld();
        update(dt);
        render();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
</script>
</body>
</html>
